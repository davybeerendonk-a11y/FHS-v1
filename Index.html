<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vloerverwarming Frees Game - Mobiel</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      margin: 0;
      padding: 10px;
      background-color: #1e1e24;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      margin: 0 0 10px 0;
      font-size: 20px;
      text-align: center;
    }
    .top-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    button.btn-top {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      background-color: #ff5722;
      color: white;
      border: none;
      border-radius: 4px;
    }
    #gameContainer {
      position: relative;
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: center;
    }
    canvas {
      background-color: #d1ccc0;
      border: 3px solid #444;
      border-radius: 6px;
      width: 100%;
      height: auto;
      max-height: 55vh;
      touch-action: none;
    }
    
    /* Touch Controls CSS */
    .controls-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      margin-top: 15px;
      padding: 0 10px;
    }
    .control-group {
      display: flex;
      gap: 10px;
    }
    .touch-btn {
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: white;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .touch-btn:active {
      background-color: #ff5722;
      border-color: #ff5722;
    }
    .btn-drive {
      background-color: rgba(46, 204, 113, 0.3);
    }
  </style>
</head>
<body>

  <h1>Vloerverwarming Frees</h1>

  <div class="top-bar">
    <button class="btn-top" onclick="resetGame()">Reset Vloer</button>
    <button class="btn-top" onclick="toggleGrid()">Grid Aan/Uit</button>
  </div>

  <div id="gameContainer">
    <canvas id="canvas" width="600" height="600"></canvas>
  </div>

  <!-- Touch Controls op het Scherm -->
  <div class="controls-container">
    <!-- Sturen (Links / Rechts) -->
    <div class="control-group">
      <div class="touch-btn" id="btnLeft">◀</div>
      <div class="touch-btn" id="btnRight">▶</div>
    </div>
    
    <!-- Rijden (Vooruit / Achteruit) -->
    <div class="control-group">
      <div class="touch-btn btn-drive" id="btnBack">▼</div>
      <div class="touch-btn btn-drive" id="btnForward">▲</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const GRID_SIZE = 25;
    const MACHINE_SPEED = 3;

    let showGrid = true;
    let paths = [];
    let currentPath = [];

    const machine = {
      x: 80,
      y: 80,
      angle: 0,
      speed: 0,
      turnSpeed: 0.07
    };

    const keys = {
      left: false,
      right: false,
      forward: false,
      back: false
    };

    // Toetsenbord ondersteuning
    window.addEventListener('keydown', e => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = true;
      if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.forward = true;
      if (['ArrowDown', 's', 'S'].includes(e.key)) keys.back = true;
    });

    window.addEventListener('keyup', e => {
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) keys.left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) keys.right = false;
      if (['ArrowUp', 'w', 'W'].includes(e.key)) keys.forward = false;
      if (['ArrowDown', 's', 'S'].includes(e.key)) keys.back = false;
    });

    // Touch event helper
    function bindTouch(elementId, actionKey) {
      const btn = document.getElementById(elementId);
      const start = (e) => { e.preventDefault(); keys[actionKey] = true; };
      const end = (e) => { e.preventDefault(); keys[actionKey] = false; };

      btn.addEventListener('touchstart', start, { passive: false });
      btn.addEventListener('touchend', end, { passive: false });
      btn.addEventListener('mousedown', start);
      btn.addEventListener('mouseup', end);
    }

    bindTouch('btnLeft', 'left');
    bindTouch('btnRight', 'right');
    bindTouch('btnForward', 'forward');
    bindTouch('btnBack', 'back');

    function init() {
      machine.x = 80;
      machine.y = 80;
      machine.angle = 0;
      paths = [];
      currentPath = [{ x: machine.x, y: machine.y }];
      paths.push(currentPath);
    }

    function resetGame() {
      init();
    }

    function toggleGrid() {
      showGrid = !showGrid;
    }

    function update() {
      if (keys.left) machine.angle -= machine.turnSpeed;
      if (keys.right) machine.angle += machine.turnSpeed;

      if (keys.forward) {
        machine.speed = MACHINE_SPEED;
      } else if (keys.back) {
        machine.speed = -MACHINE_SPEED / 2;
      } else {
        machine.speed = 0;
      }

      if (machine.speed !== 0) {
        const nextX = machine.x + Math.cos(machine.angle) * machine.speed;
        const nextY = machine.y + Math.sin(machine.angle) * machine.speed;

        // Binnen kamermuren blijven
        if (nextX > 30 && nextX < canvas.width - 30 && nextY > 30 && nextY < canvas.height - 30) {
          machine.x = nextX;
          machine.y = nextY;
          currentPath.push({ x: machine.x, y: machine.y });
        }
      }
    }

    function drawGrid() {
      ctx.strokeStyle = '#bdc3c7';
      ctx.lineWidth = 0.5;
      for (let x = 30; x < canvas.width - 30; x += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(x, 30);
        ctx.lineTo(x, canvas.height - 30);
        ctx.stroke();
      }
      for (let y = 30; y < canvas.height - 30; y += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(canvas.width - 30, y);
        ctx.stroke();
      }
    }

    function drawWalls() {
      ctx.strokeStyle = '#2c3e50';
      ctx.lineWidth = 12;
      ctx.strokeRect(24, 24, canvas.width - 48, canvas.height - 48);
    }

    function drawManifold() {
      ctx.fillStyle = '#2c3e50';
      ctx.fillRect(30, 30, 50, 30);
      ctx.fillStyle = '#ffffff';
      ctx.font = '10px Arial';
      ctx.fillText('VERDELER', 32, 48);
    }

    function drawGrooves() {
      for (let path of paths) {
        if (path.length < 2) continue;

        // Gefreesde sleuf
        ctx.strokeStyle = '#7f8c8d';
        ctx.lineWidth = 12;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(path[0].x, path[0].y);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x, path[i].y);
        }
        ctx.stroke();

        // Aanvoer (Rood)
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(path[0].x - 2, path[0].y - 2);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x - 2, path[i].y - 2);
        }
        ctx.stroke();

        // Retour (Blauw)
        ctx.strokeStyle = '#3498db';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(path[0].x + 2, path[0].y + 2);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo(path[i].x + 2, path[i].y + 2);
        }
        ctx.stroke();
      }
    }

    function drawMachine() {
      ctx.save();
      ctx.translate(machine.x, machine.y);
      ctx.rotate(machine.angle);

      // Behuizing frees
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(-16, -14, 32, 28);

      // Wielen
      ctx.fillStyle = '#333';
      ctx.fillRect(-12, -18, 8, 4);
      ctx.fillRect(-12, 14, 8, 4);
      ctx.fillRect(4, -18, 8, 4);
      ctx.fillRect(4, 14, 8, 4);

      // Freeskop
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(12, 0, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (showGrid) drawGrid();
      drawWalls();
      drawManifold();
      drawGrooves();
      update();
      drawMachine();

      requestAnimationFrame(gameLoop);
    }

    init();
    gameLoop();
  </script>
</body>
</html>
